[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-anime-analyse"
version = "0.1.0"
description = "Reference-guided multi-sport 2D anime re-animation planning engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VideoToAnimeAnalyse contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
vtaa = "vtaa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

